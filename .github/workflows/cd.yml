name: Teletype Binary Releases

on:
  workflow_dispatch:
  push:
    tags: ["*teletype.*"]

permissions:
  contents: read

env:
  CARGO_PROFILE_RELEASE_LTO: "off"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "8"

jobs:
  metadata:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      msrv: ${{ steps.metadata.outputs.msrv }}
      publish: ${{ steps.metadata.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: metadata
        run: |
          python3 - <<'PY'
          import json, os, tomllib
          from pathlib import Path
          cargo = tomllib.loads(Path("Cargo.toml").read_text())
          package = json.loads(Path("composer.json").read_text())
          version = cargo["package"]["version"]
          assert "+teletype." in version, version
          assert package["name"] == "teletype/mago"
          assert package["extra"]["mago-binary-version"] == version
          publish = os.environ["GITHUB_REF"] == f"refs/tags/{version}"
          if os.environ["GITHUB_REF"].startswith("refs/tags/"):
              assert publish, "Release tag must match the pinned binary version"
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"version={version}", file=output)
              print(f"msrv={cargo['package']['rust-version']}", file=output)
              print(f"publish={str(publish).lower()}", file=output)
          PY
      - name: Require successful CI before publishing
        if: steps.metadata.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          passed=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --json status,conclusion --jq 'any(.[]; .status == "completed" and .conclusion == "success")')
          test "$passed" = true

  build:
    needs: metadata
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: x86_64-unknown-linux-gnu, os: ubuntu-latest}
          - {target: x86_64-unknown-linux-musl, os: ubuntu-latest}
          - {target: aarch64-unknown-linux-gnu, os: ubuntu-latest}
          - {target: aarch64-unknown-linux-musl, os: ubuntu-latest}
          - {target: x86_64-apple-darwin, os: macos-latest}
          - {target: aarch64-apple-darwin, os: macos-latest}
          - {target: x86_64-pc-windows-msvc, os: windows-latest}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ needs.metadata.outputs.msrv }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Install cross
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Build binary
        shell: bash
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            cross build -p mago --locked --release --target "$RELEASE_TARGET" -j1
          else
            cargo build -p mago --locked --release --target "$RELEASE_TARGET" -j1
          fi
      - name: Package binary
        shell: bash
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: python3 scripts/package-release.py "$RELEASE_TARGET"
      - uses: shivammathur/setup-php@v2
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        with:
          php-version: "8.3"
      - name: Verify native throws in release binary
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: python3 tools/throws/test_cli.py --mago ./target/x86_64-unknown-linux-gnu/release/mago
      - uses: actions/upload-artifact@v4
        with:
          name: mago-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [metadata, build]
    if: needs.metadata.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: mago-*
          merge-multiple: true
          path: dist
      - name: Publish complete binary release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          test "$(find dist -type f | wc -l)" -eq 7
          gh release create "$RELEASE_VERSION" dist/* --verify-tag --draft --title "Mago $RELEASE_VERSION" --generate-notes
          gh release edit "$RELEASE_VERSION" --draft=false --latest
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify fresh Composer installation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/test-composer-install.py --version "${{ needs.metadata.outputs.version }}"
